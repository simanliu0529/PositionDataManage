x-runtime: &runtime
  image: python:3.12-slim
  working_dir: /app
  volumes:
    - .:/app:ro
services:
  node-0:
    <<: *runtime
    command: python -m db.node data/node-0.sqlite 8100 --host 0.0.0.0
  node-1:
    <<: *runtime
    command: python -m db.node data/node-1.sqlite 8101 --host 0.0.0.0
  web:
    <<: *runtime
    command: python -m backend.app --host 0.0.0.0
    environment:
      CHECKIN_NODE_0: http://node-0:8100
      CHECKIN_NODE_1: http://node-1:8101
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - node-0
      - node-1
